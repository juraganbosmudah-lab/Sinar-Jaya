.hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;padding:30px 20px 55px;text-align:center}
.logo{font-size:34px;font-weight:900;letter-spacing:1px}
.subtitle{margin-top:8px;color:#d1d5db}
.card{max-width:520px;margin:-28px auto 30px;background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h2{margin:0 0 18px;font-size:22px}
label{display:block;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#111827}

<div class="card">
  <h2>Form Pemesanan</h2>

  <label for="asal">Asal</label>
  <input id="asal" type="text" placeholder="Masukkan asal" autocomplete="off">

  <label for="tujuan">Tujuan</label>
  <input id="tujuan" type="text" placeholder="Masukkan tujuan" autocomplete="off">

  <label for="tanggal">Tanggal Keberangkatan</label>
  <input id="tanggal" type="date">

  <label for="jumlah">Jumlah Penumpang</label>
  <input id="jumlah" type="number" min="1" placeholder="Jumlah penumpang">

  <label for="nama">Nama Pemesan</label>
  <input id="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name">

  <button onclick="kirimWhatsApp()">Pesan via WhatsApp</button>

  <div class="note">
    Tarif tidak ditentukan otomatis. Tarif akan dikonfirmasi secara manual oleh PO Sinar Jaya melalui WhatsApp.
  </div>
</div>

<div class="footer">© 2026 PO Sinar Jaya</div>

<script>
// Ganti nomor di bawah dengan nomor WhatsApp PO Sinar Jaya.
// Format: kode negara tanpa tanda +, contoh Indonesia 62813xxxxxxxx.
const NOMOR_WHATSAPP = "628137753095";

function kirimWhatsApp(){
  const asal = document.getElementById("asal").value.trim();
  const tujuan = document.getElementById("tujuan").value.trim();
  const tanggalRaw = document.getElementById("tanggal").value;
  const jumlah = document.getElementById("jumlah").value.trim();
  const nama = document.getElementById("nama").value.trim();

  if(!asal || !tujuan || !tanggalRaw || !jumlah || !nama){
    alert("Mohon lengkapi semua data pemesanan.");
    return;
  }

  const tanggal = new Date(tanggalRaw + "T00:00:00").toLocaleDateString("id-ID", {
    day:"2-digit", month:"long", year:"numeric"
  });

  const pesan =
`🚌 *PEMESANAN PO SINAR JAYA*

👤 Nama: ${nama}
📍 Asal: ${asal}
🎯 Tujuan: ${tujuan}
📅 Tanggal: ${tanggal}
👥 Jumlah Penumpang: ${jumlah} orang

💰 Tarif: Mohon info tarif

Saya ingin memesan tiket. Mohon konfirmasi ketersediaan dan tarifnya.`;

  const url = "https://wa.me/" + NOMOR_WHATSAPP + "?text=" + encodeURIComponent(pesan);
  window.location.href = url;
}
</script>
